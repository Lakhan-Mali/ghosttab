<style>
  .gt-nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(11, 13, 20, 0.72);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--gt-border);
  }
  .gt-nav-inner { display: flex; align-items: center; justify-content: space-between; height: var(--gt-nav-h); }
  .gt-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; letter-spacing: -0.01em; }
  .gt-brand-mark { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: var(--gt-r-sm); }
  .gt-brand-text { color: var(--gt-text); }
  .gt-brand-ai { background: var(--gt-grad-violet-cyan); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .gt-nav-links { display: flex; align-items: center; gap: var(--gt-space-6); }
  .gt-nav-link { color: var(--gt-text-muted); font-size: 0.92rem; font-weight: 500; transition: color var(--gt-dur-fast) var(--gt-ease-out); }
  .gt-nav-link:hover { color: var(--gt-text); }
  .gt-nav-actions { display: flex; align-items: center; gap: var(--gt-space-3); }
  .gt-mobile-menu {
    padding: var(--gt-space-4) var(--gt-space-5) var(--gt-space-5);
    background: var(--gt-bg-elev-2);
    border-bottom: 1px solid var(--gt-border);
    display: flex; flex-direction: column; gap: var(--gt-space-3);
  }
  .gt-mobile-link { color: var(--gt-text-muted); padding: 10px 4px; font-weight: 500; }
  .gt-mobile-link:hover { color: var(--gt-text); }
  @media (min-width: 769px) { .gt-nav-links, .gt-nav-actions { display: flex !important; } }
  @media (max-width: 768px) { .gt-nav-links, .gt-nav-actions { display: none; } }
</style>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('gt-mobile-menu-btn');
    const menu = document.getElementById('gt-mobile-menu');
    if (!btn || !menu) return;
    btn.addEventListener('click', () => {
      const isOpen = menu.style.display === 'flex';
      menu.style.display = isOpen ? 'none' : 'flex';
      btn.setAttribute('aria-expanded', String(!isOpen));
    });
  });
</script>
