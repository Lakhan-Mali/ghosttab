services:
  - type: web
    name: ghosttab-ai
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application --log-file -"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "ghosttab-ai-pc74.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://ghosttab-ai-pc74.onrender.com"
      - key: AI_PROVIDER
        value: "demo"
      - key: PYTHON_VERSION
        value: "3.12.15"
    autoDeploy: true
